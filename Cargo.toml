[package]
name = "rustclamp-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Message handler contributions and routing for RustClamp workers."
repository = "https://github.com/rustclamp/worker"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
rustclamp-core = { version = "0.1.0", path = "../core" }
rustclamp-messaging = { version = "0.1.0", path = "../messaging" }
serde = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
